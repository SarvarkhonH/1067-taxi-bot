<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ravella — saxna bezaklari va bayram yozuvlari</title>
<meta name="description" content="Ravella: saxna bezaklari, bayram yozuvlari, kirish arkalari. Bezakni o'zingiz yig'ing — qo'shimchani tanlang, rasm darhol o'zgaradi. Buyurtma BirJoy ilovasi orqali." />
<meta property="og:title" content="Ravella — saxna bezaklari va bayram yozuvlari" />
<meta property="og:description" content="Orzudagi bezaklar — Ravella bilan. Bezakni o'zingiz yig'ing: qo'shimchani tanlang, natijani darhol ko'ring." />
<meta property="og:image" content="/ravella/logo.jpg" />
<link rel="icon" href="/ravella/logo-mark.png" />
<!--
  🎀 Ravella — OMMAVIY sahifa (mini app EMAS). Mini app Telegram imzosini talab qiladi, bu sahifa
  esa oddiy havola bilan har kimga ochiladi. Faqat KO'RISH: buyurtma bu yerdan berilmaydi —
  tugma BirJoy ilovasiga olib boradi (u yerda kim buyurtma berayotgani aniq va hamkorga karta
  ketadi). Narx bu faylda YOZILMAGAN va umuman ko'rsatilmaydi (ega qarori: narxni operator aytadi).
  Uslub: Apple (iOS) — ierarxiya o'lcham va bo'sh joy bilan, hairline ajratgichlar, ≥44px tegish
  maydonlari, amber faqat bosiladigan/tanlangan narsa uchun.
-->
<style>
  /* Liquid Glass (Apple iOS 26 tili). Haqiqiy sinish SVG feDisplacementMap bilan bo'ladi, lekin
     uni backdrop-filter ichida faqat Chromium qo'llaydi — shuning uchun bu yerda: kuchli
     saturate+brightness (shisha ortidagi rang jonlanadi), to'rt tomonlama qirra-yorug'ligi va
     chuqurlik soyasi. Safari'da ham, Chrome'da ham bir xil ko'rinadi.
     Manbalar: css-tricks.com/getting-clarity-on-apples-liquid-glass, kube.io/blog/liquid-glass-css-svg */
  :root {
    --ink:#1d1d1f; --t2:#55555a; --t3:#8a8a8f;
    --amber:#d98f00; --fill:#f9be3e;
    --sep:rgba(60,60,67,.10);
    --glass-bg:rgba(255,255,255,.55);
    --glass-blur:saturate(190%) brightness(1.06) blur(26px);
    --glass-rim:
      inset 0 1px 0 rgba(255,255,255,.85),
      inset 0 -1px 0 rgba(255,255,255,.30),
      inset 1px 0 0 rgba(255,255,255,.35),
      inset -1px 0 0 rgba(255,255,255,.35);
    --glass-depth:0 12px 32px -18px rgba(31,30,26,.55), 0 2px 6px -4px rgba(31,30,26,.25);
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body {
    color:var(--ink); letter-spacing:-.01em; min-height:100vh; padding-bottom:120px;
    font:15px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(249,190,62,.20) 0%, transparent 60%),
      radial-gradient(90% 60% at 100% 8%, rgba(120,180,255,.12) 0%, transparent 55%),
      #f2f2f5;
    background-attachment:fixed;
  }
  .wrap { max-width:600px; margin:0 auto; padding:0 20px; }
  .hero { text-align:center; padding:42px 20px 22px; }
  .badge {
    width:96px; height:96px; margin:0 auto 16px; border-radius:25px; overflow:hidden;
    background:rgba(255,255,255,.62);
    -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
    box-shadow:var(--glass-rim), 0 20px 44px -24px rgba(31,30,26,.75);
  }
  .badge img { width:100%; height:100%; object-fit:contain; display:block; padding:9px; }
  h1 { font-size:36px; line-height:1.06; font-weight:700; letter-spacing:-.026em; }
  .hero p { margin-top:7px; font-size:16.5px; color:var(--t2); }
  .promo, .list {
    background:var(--glass-bg);
    -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
    box-shadow:var(--glass-rim), var(--glass-depth);
  }
  .promo { margin:0 0 20px; padding:15px 17px; border-radius:18px; font-size:15px; }
  .promo b { color:var(--amber); font-weight:600; }
  h2 { margin:28px 0 14px; font-size:24px; font-weight:700; letter-spacing:-.022em; }

  /* Karta: rasm butun yuzani egallaydi, nom rasm USTIDA (Apple TV naqshi) */
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .card {
    position:relative; aspect-ratio:4/5; border-radius:22px; overflow:hidden; border:none; padding:0;
    text-align:left; color:inherit; font:inherit; cursor:pointer;
    background:var(--glass-bg);
    -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
    box-shadow:var(--glass-rim), var(--glass-depth);
    transition:transform .25s cubic-bezier(.2,.9,.3,1.2), box-shadow .25s ease;
  }
  .card:active { transform:scale(.965); box-shadow:var(--glass-rim), 0 6px 16px -12px rgba(31,30,26,.6); }
  .card .ph { position:absolute; inset:0; }
  .card .ph img { width:100%; height:100%; object-fit:cover; display:block; }
  .card .ph::after {
    content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(to top, rgba(0,0,0,.74) 0%, rgba(0,0,0,.30) 34%, transparent 62%);
  }
  .card .ph.noimg { background:linear-gradient(160deg, rgba(249,190,62,.38), rgba(255,255,255,.12)); display:flex; align-items:center; justify-content:center; font-size:40px; color:rgba(31,30,26,.35); }
  .card .bd { position:absolute; left:0; right:0; bottom:0; padding:14px; z-index:1; }
  .card .nm { font-size:16px; font-weight:650; line-height:1.22; color:#fff; text-shadow:0 1px 10px rgba(0,0,0,.55); }
  .card .pr { margin-top:3px; font-size:12.5px; color:rgba(255,255,255,.85); }
  .muted { color:var(--t2); }

  /* Karusel */
  .stage {
    position:relative; border-radius:24px; overflow:hidden; aspect-ratio:4/3;
    background:rgba(120,120,128,.10);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.45), var(--glass-depth);
  }
  .slides { display:flex; width:100%; height:100%; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  .slides::-webkit-scrollbar { display:none; }
  .slide { flex:0 0 100%; width:100%; height:100%; object-fit:cover; scroll-snap-align:center; }
  .dots {
    position:absolute; left:50%; transform:translateX(-50%); bottom:12px;
    display:flex; gap:6px; align-items:center; padding:7px 10px; border-radius:999px;
    background:rgba(255,255,255,.28);
    -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.55); pointer-events:none;
  }
  .dots span { width:6px; height:6px; border-radius:3px; background:rgba(255,255,255,.6); transition:width .25s cubic-bezier(.2,.9,.3,1.2), background .25s ease; }
  .dots span.on { width:20px; background:#fff; }

  .title { margin-top:20px; font-size:27px; font-weight:700; letter-spacing:-.024em; line-height:1.16; }
  .desc { margin-top:8px; font-size:16px; line-height:1.45; color:var(--t2); }
  /* Orqaga — shisha kapsula, boshqa sirtlar bilan bir retsept */
  .back {
    display:inline-flex; align-items:center; gap:5px;
    min-height:44px; margin:0 0 14px; padding:10px 16px 10px 13px;
    border:none; border-radius:999px; cursor:pointer;
    color:var(--ink); letter-spacing:-.01em;
    font:500 16px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:var(--glass-bg);
    -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
    box-shadow:var(--glass-rim), 0 10px 24px -16px rgba(31,30,26,.8);
    transition:transform .22s cubic-bezier(.2,.9,.3,1.2);
  }
  .back:active { transform:scale(.94); }
  .back svg { width:19px; height:19px; display:block; color:var(--amber); }
  .note { margin:20px 0 8px; font-size:13px; color:var(--t3); line-height:1.5; }

  /* Aloqa ikonkalari — har tarmoq o'z rangida, ustida yupqa yorug'lik */
  .ci {
    width:46px; height:46px; border-radius:23px; display:inline-flex; align-items:center; justify-content:center;
    background:#8e8e93; color:#fff; text-decoration:none; border:none;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 8px 18px -10px rgba(31,30,26,.8);
    transition:transform .22s cubic-bezier(.2,.9,.3,1.2);
  }
  .ci:active { transform:scale(.9); }
  .ci svg { width:21px; height:21px; display:block; }
  .ci.phone { background:linear-gradient(180deg,#ffd36b,#f2a71b); color:#2a1f00; }
  .ci.telegram { background:linear-gradient(180deg,#35b6ee,#1c93cf); }
  .ci.instagram { background:linear-gradient(45deg,#F58529 0%,#DD2A7B 45%,#8134AF 75%,#515BD4 100%); }
  .ci.youtube { background:linear-gradient(180deg,#ff3b3b,#e00000); }
  .ci.tiktok { background:linear-gradient(180deg,#2b2b2b,#000); }
  .ci.facebook { background:linear-gradient(180deg,#2b8cff,#0f66d0); }
  .ci.website { background:linear-gradient(180deg,#4a4a4f,#2c2c30); }

  /* Suzuvchi shisha panel */
  .bar {
    position:fixed; left:12px; right:12px; bottom:12px; border-radius:26px;
    background:rgba(255,255,255,.58);
    -webkit-backdrop-filter:saturate(220%) brightness(1.08) blur(32px);
    backdrop-filter:saturate(220%) brightness(1.08) blur(32px);
    box-shadow:var(--glass-rim), 0 20px 44px -20px rgba(31,30,26,.75);
  }
  .bar .in { max-width:576px; margin:0 auto; padding:11px 12px 11px 18px; display:flex; align-items:center; gap:14px; }
  .bar small { display:block; color:var(--t2); font-size:12px; }
  .bar b { font-size:17px; font-weight:650; letter-spacing:-.02em; }
  .bar .icons { display:flex; gap:8px; margin-left:auto; }
  .cta {
    margin-left:auto; flex:0 0 auto; min-height:48px; padding:13px 22px; border-radius:16px; border:none;
    background:linear-gradient(180deg,#ffd36b,#f2a71b); color:#2a1f00;
    font-size:17px; font-weight:650; text-decoration:none; display:inline-flex; align-items:center; cursor:pointer;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.75), 0 10px 22px -12px rgba(242,167,27,.95);
    transition:transform .22s cubic-bezier(.2,.9,.3,1.2);
  }
  .cta:active { transform:scale(.96); }

  /* 📹 Hikoya halqasi va ko'ruvchisi. Saytda "ko'rilgan" holati yo'q (autentifikatsiya yo'q) —
     halqa har doim rangli. Bu to'g'ri: hikoya ommaviy kontent, ko'rildi esa shaxsiy holat. */
  .badge.ring { position:relative; cursor:pointer; }
  .badge.ring::after {
    content:""; position:absolute; inset:-6px; border-radius:31px; pointer-events:none;
    background:conic-gradient(from 210deg,#f9be3e,#ff9d2e,#f9be3e,#ffd36b,#f9be3e);
    -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
    mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
  }
  .sv { position:fixed; inset:0; z-index:3000; background:#000; display:flex; align-items:center; justify-content:center; }
  .sv-media { width:100%; height:100%; object-fit:contain; display:block; }
  .sv-pg { position:absolute; top:calc(10px + env(safe-area-inset-top)); left:10px; right:10px; z-index:2; display:flex; gap:4px; }
  .sv-pg span { flex:1; height:3px; border-radius:2px; background:rgba(255,255,255,.3); }
  .sv-pg span.on { background:#fff; }
  .sv-head { position:absolute; top:calc(24px + env(safe-area-inset-top)); left:12px; right:12px; z-index:2; display:flex; align-items:center; gap:9px; }
  .sv-av { width:32px; height:32px; border-radius:10px; object-fit:contain; background:#fff; padding:3px; }
  .sv-nm { color:#fff; font-size:15px; font-weight:600; text-shadow:0 1px 6px rgba(0,0,0,.6); }
  .sv-x { margin-left:auto; width:36px; height:36px; border-radius:18px; border:none; cursor:pointer;
          background:rgba(255,255,255,.18); color:#fff; font-size:17px;
          -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); }
  .sv-cap { position:absolute; left:16px; right:16px; bottom:calc(28px + env(safe-area-inset-bottom)); z-index:2;
            color:#fff; font-size:15px; line-height:1.4; text-align:center; text-shadow:0 1px 10px rgba(0,0,0,.7); }
  .sv-tap { position:absolute; top:0; bottom:0; width:40%; border:none; background:transparent; z-index:1; cursor:pointer; }
  .sv-tap.l { left:0; }
  .sv-tap.r { right:0; width:60%; }
  /* V1: kartada surish */
  .card .slides2 { display:flex; width:100%; height:100%; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  .card .slides2::-webkit-scrollbar { display:none; }
  .card .slides2 img { flex:0 0 100%; width:100%; height:100%; object-fit:cover; scroll-snap-align:center; }
  .card .cdots { position:absolute; left:0; right:0; bottom:46px; z-index:2; display:flex; gap:4px; justify-content:center; pointer-events:none; }
  .card .cdots span { width:5px; height:5px; border-radius:3px; background:rgba(255,255,255,.55); box-shadow:0 1px 3px rgba(0,0,0,.4); transition:width .2s ease,background .2s ease; }
  .card .cdots span.on { width:14px; background:#fff; }
  /* V2: to'liq ekran */
  .lb { position:fixed; inset:0; z-index:2500; background:rgba(0,0,0,.96); display:flex; align-items:center; justify-content:center; }
  .lb-strip { display:flex; width:100%; height:100%; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; }
  .lb-strip::-webkit-scrollbar { display:none; }
  .lb-strip img { flex:0 0 100%; width:100%; height:100%; object-fit:contain; scroll-snap-align:center; }
  .lb-x { position:absolute; top:calc(14px + env(safe-area-inset-top)); right:14px; z-index:2; width:40px; height:40px; border-radius:20px; border:none; cursor:pointer;
          background:rgba(255,255,255,.18); color:#fff; font-size:18px; -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); }
  .lb-n { position:absolute; top:calc(20px + env(safe-area-inset-top)); left:16px; z-index:2; color:#fff; font-size:14px; font-weight:600; text-shadow:0 1px 6px rgba(0,0,0,.6); }
  .slide { cursor:zoom-in; }
  /* V3: ulashish va so'rov maydonlari */
  .row2 { display:flex; align-items:flex-start; gap:12px; }
  .row2 .title { flex:1; min-width:0; }
  .share {
    flex:0 0 auto; width:46px; height:46px; margin-top:20px; border-radius:23px; border:none; cursor:pointer; color:var(--ink);
    background:var(--glass-bg); -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
    box-shadow:var(--glass-rim), 0 8px 20px -14px rgba(31,30,26,.8);
    transition:transform .22s cubic-bezier(.2,.9,.3,1.2);
  }
  .share:active { transform:scale(.92); }
  .share svg { width:20px; height:20px; display:block; margin:0 auto; }
  .ask { margin-top:18px; display:grid; gap:8px; }
  .ask input {
    width:100%; padding:13px 15px; border-radius:14px; border:none; font:16px/1.2 inherit; color:var(--ink);
    background:rgba(255,255,255,.65); box-shadow:var(--glass-rim);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  }
  .ask input::placeholder { color:var(--t3); }
  .skl { background:rgba(255,255,255,.5); border-radius:22px; height:220px; animation:sh 1.4s ease-in-out infinite; }
  @keyframes sh { 0%,100%{opacity:.5} 50%{opacity:.9} }

  /* Shisha yo'q brauzerda sirt qattiq oq bo'ladi — matn har doim o'qiladi */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .card, .promo, .list, .bar, .badge, .back { background:rgba(255,255,255,.94); }
  }
  @media (prefers-reduced-motion: reduce) { .skl{animation:none} .card,.cta,.ci,.dots span,.back{transition:none} }
</style>
</head>
<body>
<div class="hero">
  <div class="badge"><img src="/ravella/logo-mark.png" alt="" onerror="this.parentElement.style.display='none'" /></div>
  <h1>Ravella</h1>
  <p>Orzudagi bezaklar — Ravella bilan</p>
</div>
<div class="wrap"><div id="app"><div class="skl"></div></div></div>

<script>
var BOT = "https://t.me/koson1067bot/app?startapp=ravella";
// Ega qarori 2026-07-27: saytdan "Buyurtma berish" bosilsa RAVELLA'ning Telegramiga o'tsin —
// mijoz odam bilan yozishadi. Telegram sozlanmagan bo'lsa telefonga, u ham yo'q bo'lsa ilovaga.
function orderHref() {
  if (CONTACTS.telegram) return contactHref("telegram", CONTACTS.telegram);
  if (CONTACTS.phone) return contactHref("phone", CONTACTS.phone);
  return BOT;
}
var API = location.hostname === "localhost" ? "" : "https://api.birjoy.online";
// ?p=<token> — ega bergan preview havolasi: xizmat hali ommaga ochilmagan bo'lsa ham ko'rsatadi.
var P = new URLSearchParams(location.search).get("p");
var q = P ? "?p=" + encodeURIComponent(P) : "";
// Narx ko'rsatilmaydi (ega qarori): 0 bo'lsa raqam emas, matn chiqadi.
var NO_PRICE = "Narxi kelishiladi";
var money = function (n) { return (n || 0).toLocaleString("ru-RU").replace(/,/g, " "); };
var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); };
var CONTACTS = {};
// Chiziqli belgilar — tashqi kutubxona yo'q, hammasi inline SVG (CSP toza, so'rov yo'q).
var ICON = {
  phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 1.9.6 2.8a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.5 2.8.6a2 2 0 0 1 1.7 2z"/></svg>',
  telegram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 3.5 2.9 10.8c-.8.3-.8 1.4 0 1.7l4.6 1.5 1.8 5.4c.2.7 1.1.9 1.6.3l2.5-2.7 4.7 3.5c.6.4 1.4.1 1.6-.6l3-14.6c.2-.8-.6-1.5-1.2-1.3z"/><path d="M7.5 14 19 6.5 10 15.4"/></svg>',
  instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/></svg>',
  youtube: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9.2v5.6l5-2.8z" fill="currentColor" stroke="none"/></svg>',
  tiktok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3v9.5a4 4 0 1 1-3.2-3.9"/><path d="M15 6.2A5 5 0 0 0 19.5 9"/></svg>',
  facebook: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 8.5H17V5.6h-2.6c-2 0-3.4 1.4-3.4 3.5v1.6H9v3h2v7h3v-7h2.3l.5-3H14v-1.3c0-.6.2-.9.5-.9z"/></svg>',
  website: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9S14.5 18.4 12 21c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>'
};
// Xom qiymatni haqiqiy havolaga aylantirish (ega botga "@ravella" ham, to'liq havola ham yozishi mumkin)
function contactHref(kind, v) {
  var t = String(v).trim();
  if (kind === "phone") return "tel:" + t.replace(/[^\d+]/g, "");
  if (/^https?:\/\//i.test(t)) return t;
  var u = t.replace(/^@/, "");
  if (kind === "telegram") return "https://t.me/" + u;
  if (kind === "instagram") return "https://instagram.com/" + u;
  if (kind === "youtube") return "https://youtube.com/" + (u.charAt(0) === "@" ? u : "@" + u);
  if (kind === "tiktok") return "https://tiktok.com/@" + u;
  if (kind === "facebook") return "https://facebook.com/" + u;
  return "https://" + u;
}
function contactIcons() {
  var order = ["phone", "telegram", "instagram", "youtube", "tiktok", "facebook", "website"];
  var out = "";
  order.forEach(function (k) {
    if (!CONTACTS[k]) return;
    out += '<a class="ci ' + k + '" href="' + contactHref(k, CONTACTS[k]) + '"' +
      (k === "phone" ? "" : ' target="_blank" rel="noopener"') + ' aria-label="' + k + '">' + ICON[k] + "</a>";
  });
  return out;
}

var app = document.getElementById("app");
var DISC = 0, CB = 0;

function get(path) {
  return fetch(API + path + (path.indexOf("?") === -1 ? q : q.replace("?", "&"))).then(function (r) { return r.json(); });
}
function empty(msg) { app.innerHTML = '<p class="note" style="text-align:center;padding:40px 0">' + esc(msg) + "</p>"; }

// 📹 Hikoya: ro'yxat FAQAT halqa bosilganda yuklanadi (katalogdagi storyCount chizishga yetadi)
var STORIES = null, SIDX = 0, STIMER = null, CUR_ITEM = null;
function openStories() {
  if (STORIES) { showStory(0); return; }
  get("/api/ravella/stories").then(function (d) {
    STORIES = d.stories || [];
    if (STORIES.length) showStory(0);
  }).catch(function () {});
}
function closeStory() {
  clearTimeout(STIMER);
  var el = document.getElementById("sv");
  if (el) el.remove();
}
function showStory(i) {
  clearTimeout(STIMER);
  if (i < 0) return;
  if (i >= STORIES.length) { closeStory(); return; }
  SIDX = i;
  var st = STORIES[i];
  var el = document.getElementById("sv");
  if (!el) { el = document.createElement("div"); el.id = "sv"; el.className = "sv"; document.body.appendChild(el); }
  var media = st.kind === "video"
    ? '<video class="sv-media" src="' + API + "/api/ravella/story-media/" + st.id + '" autoplay muted playsinline id="svv"></video>'
    : '<img class="sv-media" src="' + API + "/api/ravella/story-media/" + st.id + '" alt="">';
  var pg = "";
  STORIES.forEach(function (_, n) { pg += "<span" + (n <= i ? ' class="on"' : "") + "></span>"; });
  el.innerHTML = '<div class="sv-pg">' + pg + "</div>" +
    '<div class="sv-head"><img class="sv-av" src="/ravella/logo-mark.png" alt=""><span class="sv-nm">Ravella</span>' +
    '<button class="sv-x" aria-label="Yopish">✕</button></div>' + media +
    (st.caption ? '<div class="sv-cap">' + esc(st.caption) + "</div>" : "") +
    '<button class="sv-tap l" aria-label="Oldingi"></button><button class="sv-tap r" aria-label="Keyingi"></button>';
  el.querySelector(".sv-x").onclick = closeStory;
  el.querySelector(".sv-tap.l").onclick = function () { showStory(SIDX - 1); };
  el.querySelector(".sv-tap.r").onclick = function () { showStory(SIDX + 1); };
  if (st.kind === "video") {
    var v = document.getElementById("svv");
    if (v) v.onended = function () { showStory(SIDX + 1); };
  } else {
    STIMER = setTimeout(function () { showStory(SIDX + 1); }, 5000);
  }
}

// V2: rasmni to'liq ekranda ochish
function lightbox(srcs, start) {
  var el = document.createElement("div");
  el.className = "lb";
  var strip = '<div class="lb-strip" id="lbs">';
  srcs.forEach(function (u) { strip += '<img src="' + u + '" alt="">'; });
  strip += "</div>";
  el.innerHTML = strip + '<div class="lb-n" id="lbn">' + (start + 1) + "/" + srcs.length + '</div><button class="lb-x" aria-label="Yopish">✕</button>';
  document.body.appendChild(el);
  var s = document.getElementById("lbs"), n = document.getElementById("lbn");
  s.scrollLeft = start * s.clientWidth;
  s.addEventListener("scroll", function () {
    n.textContent = (Math.round(s.scrollLeft / Math.max(1, s.clientWidth)) + 1) + "/" + srcs.length;
  });
  el.querySelector(".lb-x").onclick = function () { el.remove(); };
}

// V3: ulashish — oila maslahatlashadi, skrinshot o'rniga chiroyli havola ketsin
function shareItem(name) {
  var url = "https://app.birjoy.online/ravella";
  var text = "🎀 " + name + " — Ravella bezaklari";
  if (navigator.share) { navigator.share({ title: "Ravella", text: text, url: url }).catch(function () {}); return; }
  window.open("https://t.me/share/url?url=" + encodeURIComponent(url) + "&text=" + encodeURIComponent(text), "_blank");
}

// V3: narx so'rash — birinchi jumlani BIZ yozamiz, mijoz faqat yuboradi
function askHref(name) {
  var date = (document.getElementById("askDate") || {}).value || "";
  var place = (document.getElementById("askPlace") || {}).value || "";
  var msg = "Salom! «" + name + "» bezagi bo'yicha narx so'ramoqchi edim.";
  if (date.trim()) msg += " Sana: " + date.trim() + ".";
  if (place.trim()) msg += " Joy: " + place.trim() + ".";
  if (CONTACTS.telegram) {
    var u = String(CONTACTS.telegram).trim().replace(/^@/, "").replace(/^https?:\/\/t\.me\//i, "");
    return "https://t.me/" + u + "?text=" + encodeURIComponent(msg);
  }
  if (CONTACTS.phone) return contactHref("phone", CONTACTS.phone);
  return BOT;
}

function catalogue() {
  app.innerHTML = '<div class="skl"></div>';
  get("/api/ravella/catalog").then(function (d) {
    DISC = d.discountPct || 0; CB = d.cashbackPct || 0; CONTACTS = d.contacts || {};
    // Halqa faqat hikoya BOR bo'lganda — bo'sh halqa bosilib hech nima ochilmasligi yomon holat
    var badge = document.querySelector(".badge");
    if (badge && d.storyCount > 0) { badge.classList.add("ring"); badge.onclick = openStories; }
    if (!d.categories || !d.categories.length) { empty("Bezaklar tez orada shu yerda bo'ladi."); return; }
    var h = "";
    if (DISC > 0) h += '<div class="promo">🎁 BirJoy orqali <b>' + DISC + "% arzon</b>" + (CB > 0 ? " · <b>" + CB + "% tanga</b> qaytadi" : "") + "</div>";
    // Bo'lim bitta bo'lsa sarlavha chiqarilmaydi — kartalar o'zi gapiradi
    var many = d.categories.length > 1;
    d.categories.forEach(function (c) {
      h += (many ? "<h2>" + esc(c.emoji) + " " + esc(c.name) + "</h2>" : "") + '<div class="grid">';
      c.items.forEach(function (it) {
        var srcs = (it.photoIds && it.photoIds.length)
          ? it.photoIds.map(function (pid) { return API + "/api/ravella/gallery/" + pid; })
          : (it.hasPhoto ? [API + "/api/ravella/photo/" + it.id] : []);
        var inner = "";
        if (srcs.length) {
          inner = '<div class="ph"><div class="slides2">';
          srcs.forEach(function (u) { inner += '<img src="' + u + '" alt="">'; });
          inner += "</div>";
          if (srcs.length > 1) {
            inner += '<div class="cdots">';
            srcs.forEach(function (_, n) { inner += "<span" + (n === 0 ? ' class="on"' : "") + "></span>"; });
            inner += "</div>";
          }
          inner += "</div>";
        } else {
          inner = '<div class="ph noimg">🎀</div>';
        }
        h += '<div class="card" role="button" tabindex="0" data-id="' + it.id + '">' + inner +
          '<div class="bd"><div class="nm">' + esc(it.name) + '</div><div class="pr">' +
          (it.basePriceSom > 0 ? money(it.basePriceSom) + " so'mdan" : NO_PRICE) + "</div></div></div>";
      });
      h += "</div>";
    });
    h += '<p class="note">Narx bezak o\'lchamiga va joyiga qarab hisoblanadi — buyurtmadan keyin operator qo\'ng\'iroq qilib aytadi.</p>';
    app.innerHTML = h;
    // Bosish/surish ajratimi: ochish `click`da emas, 8px dan kam siljigan `pointerup`da.
    // Aks holda kartani surganda sahifa ochilib ketadi va katalog "sinib qolgandek" tuyuladi.
    [].forEach.call(app.querySelectorAll(".card"), function (b) {
      var d = null;
      b.addEventListener("pointerdown", function (e) { d = { x: e.clientX, y: e.clientY }; });
      b.addEventListener("pointerup", function (e) {
        if (!d) return;
        var moved = Math.abs(e.clientX - d.x) >= 8 || Math.abs(e.clientY - d.y) >= 8;
        d = null;
        if (!moved) item(Number(b.getAttribute("data-id")));
      });
      var sl = b.querySelector(".slides2"), dots = b.querySelector(".cdots");
      if (sl && dots) {
        sl.addEventListener("scroll", function () {
          var i = Math.round(sl.scrollLeft / Math.max(1, sl.clientWidth));
          [].forEach.call(dots.children, function (dot, n) { dot.className = n === i ? "on" : ""; });
        });
      }
    });
    CUR_ITEM = null;
    bar(null);
  }).catch(function () { empty("Yuklanmadi — internetni tekshirib qayta urinib ko'ring."); });
}

function item(id) {
  window.scrollTo(0, 0);
  app.innerHTML = '<div class="skl"></div>';
  get("/api/ravella/item/" + id).then(function (d) {
    if (!d.item) { empty("Bezak topilmadi."); return; }
    var qty = {}, heroAddon = null;
    var photo = function (a) { return API + "/api/ravella/addon-photo/" + a; };
    CUR_ITEM = d.item.name;
    var draw = function () {
      // Qo'shimchalar (+/−) EKRANDAN OLIB TASHLANDI — ega qarori: keyingi bosqichda qaytadi.
      var srcs = (d.photoIds && d.photoIds.length)
        ? d.photoIds.map(function (pid) { return API + "/api/ravella/gallery/" + pid; })
        : (d.item.hasPhoto ? [API + "/api/ravella/photo/" + d.item.id] : []);
      var h = '<button class="back" aria-label="Orqaga"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg><span>Orqaga</span></button><div class="stage">';
      if (srcs.length) {
        h += '<div class="slides" id="sl">';
        srcs.forEach(function (u) { h += '<img class="slide" src="' + u + '" alt="">'; });
        h += "</div>";
        if (srcs.length > 1) {
          h += '<div class="dots" id="dots">';
          srcs.forEach(function (_, i) { h += "<span" + (i === 0 ? ' class="on"' : "") + "></span>"; });
          h += "</div>";
        }
      }
      h += "</div>" +
        '<div class="row2"><div class="title">' + esc(d.item.name) + "</div>" +
        '<button class="share" aria-label="Ulashish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M12 3 8 7M12 3l4 4"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button></div>' +
        (d.item.desc ? '<p class="desc">' + esc(d.item.desc) + "</p>" : "") +
        '<div class="ask"><input id="askDate" placeholder="Sana (ixtiyoriy) — masalan 5-avgust"><input id="askPlace" placeholder="Joy (ixtiyoriy) — masalan Koson to\'yxonasi"></div>' +
        '<p class="note">Sana va joyni yozsangiz — Ravella darhol narx aytadi, ortiqcha yozishmasiz.</p>';
      app.innerHTML = h;
      app.querySelector(".back").onclick = catalogue;
      var shareBtn = app.querySelector(".share");
      if (shareBtn) shareBtn.onclick = function () { shareItem(d.item.name); };
      [].forEach.call(app.querySelectorAll(".slide"), function (img, i) {
        img.onclick = function () { lightbox(srcs, i); };
      });
      var sl = document.getElementById("sl"), dots = document.getElementById("dots");
      if (sl && dots) {
        sl.addEventListener("scroll", function () {
          var i = Math.round(sl.scrollLeft / Math.max(1, sl.clientWidth));
          [].forEach.call(dots.children, function (dot, n) { dot.className = n === i ? "on" : ""; });
        });
      }
      bar(0, 0);
    };
    DISC = d.discountPct || DISC; CB = d.cashbackPct || CB; CONTACTS = d.contacts || CONTACTS;
    draw();
  }).catch(function () { empty("Yuklanmadi — qayta urinib ko'ring."); });
}

// Pastki panel. Narx yo'q bo'lsa summa o'rniga TANLOV holati ko'rsatiladi — bo'sh "0 so'm" emas.
function bar(sub, picked) {
  var el = document.getElementById("bar");
  if (!el) { el = document.createElement("div"); el.id = "bar"; el.className = "bar"; document.body.appendChild(el); }
  // Katalog holati: ega qarori 2026-07-27 — «Ilovada ochish» tugmasi OLIB TASHLANDI.
  // O'rniga qo'ng'iroq (asosiy harakat) va ijtimoiy tarmoq ikonkalari.
  if (sub == null) {
    var icons = contactIcons();
    el.innerHTML = '<div class="in"><div><small>Orzudagi bezaklar</small><b>Ravella</b></div>' +
      (icons ? '<div class="icons">' + icons + "</div>" : "") + "</div>";
    return;
  }
  var left;
  if (sub > 0) {
    var fin = Math.max(0, sub - Math.floor(sub * DISC / 100));
    left = "<small>Jami" + (DISC > 0 ? " (BirJoy −" + DISC + "%)" : "") + "</small><b>" + money(fin) + " so'm</b>";
  } else {
    left = "<small>Narx bezakka qarab</small><b>" + NO_PRICE + "</b>";
  }
  // CTA bosilganda tayyor matn bilan Telegram ochiladi (sana/joy yozilgan bo'lsa qo'shiladi)
  el.innerHTML = '<div class="in"><div>' + left + '</div><a class="cta" id="ctaBtn" href="#" target="_blank" rel="noopener">Narxini so\'rash</a></div>';
  var btn = document.getElementById("ctaBtn");
  if (btn) btn.onclick = function () { btn.href = CUR_ITEM ? askHref(CUR_ITEM) : orderHref(); };
}

catalogue();
</script>
