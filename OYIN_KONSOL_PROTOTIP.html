<title>BirJoy — O'yin Konsoli</title>

<style>
/* ═══════════════════════════════════════════════════════════════════════
   BirJoy O'yin Konsoli — PROTOTIP
   Ranglar/o'lchamlar loyihaning O'Z fayllaridan: packages/admin/src/design/tokens.css
   Ya'ni bu prototip real mahsulotda aynan shunday chiqadi.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --bg:#080b12; --surface:#0e131e; --surface-2:#141b29; --surface-3:#1b2436;
  --overlay:rgba(4,6,11,.72);
  --line:#1e2938; --line-2:#2a3850;
  --text:#e7ecf7; --text-2:#9aa9c2; --text-3:#62718c;
  --brand:#0d9668; --brand-hi:#12b37c; --brand-ink:#3ddc9a;
  --brand-soft:rgba(13,150,104,.14); --brand-line:rgba(13,150,104,.38); --on-brand:#04150e;
  --coin:#ffb300; --coin-ink:#ffc94d; --coin-soft:rgba(255,179,0,.13);
  --ok:#22c55e; --ok-ink:#4ade80; --ok-soft:rgba(34,197,94,.13);
  --warn:#f59e0b; --warn-ink:#fbbf24; --warn-soft:rgba(245,158,11,.13);
  --bad:#ef4444; --bad-ink:#f87171; --bad-soft:rgba(239,68,68,.13);
  --info:#3b82f6; --info-ink:#60a5fa; --info-soft:rgba(59,130,246,.13);
  --c1:#199e70; --c2:#3987e5; --c3:#d95926; --c4:#9085e9; --c5:#c98500; --c6:#d55181;
  --grid-line:rgba(255,255,255,.07);
  --ff:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
  --ff-mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
  --fs-11:.6875rem; --fs-12:.75rem; --fs-13:.8125rem; --fs-14:.875rem;
  --fs-16:1rem; --fs-20:1.25rem; --fs-26:1.625rem; --fs-32:2rem;
  --fw-med:500; --fw-semi:600; --fw-bold:700; --fw-black:800;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px; --s-8:32px;
  --r-sm:6px; --r:9px; --r-lg:13px; --r-pill:999px;
  --sh-2:0 4px 14px rgba(0,0,0,.45); --sh-3:0 18px 48px rgba(0,0,0,.6);
  --ring:0 0 0 2px var(--bg),0 0 0 4px var(--brand-line);
  --rail-w:236px; --vital-h:56px; --row-h:38px; --ctrl-h:32px;
  --dur-fast:90ms; --dur:160ms; --ease:cubic-bezier(.22,.8,.32,1);
}
:root[data-theme="light"]{
  --bg:#f6f8fb; --surface:#fff; --surface-2:#f2f5f9; --surface-3:#e8edf4;
  --overlay:rgba(16,24,40,.44); --line:#e2e8f0; --line-2:#cbd5e1;
  --text:#0f1729; --text-2:#52627c; --text-3:#8494ab;
  --brand-ink:#07704e; --brand-soft:rgba(13,150,104,.1); --brand-line:rgba(13,150,104,.34);
  --coin-ink:#a86800; --coin-soft:rgba(255,179,0,.16);
  --ok-ink:#157f3d; --ok-soft:rgba(34,197,94,.12);
  --warn-ink:#96590a; --warn-soft:rgba(245,158,11,.15);
  --bad-ink:#b91c1c; --bad-soft:rgba(239,68,68,.1);
  --info-ink:#1d4ed8; --info-soft:rgba(59,130,246,.11);
  --c1:#1baf7a; --c2:#2a78d6; --c3:#eb6834; --c4:#4a3aa7; --c5:#eda100; --c6:#e87ba4;
  --grid-line:rgba(15,23,41,.08);
}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:var(--fw-med) var(--fs-14)/1.5 var(--ff);
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:var(--r-sm)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── QOBIQ ─────────────────────────────────────────────────────────────── */
.app{display:grid;grid-template-columns:var(--rail-w) 1fr;min-height:100vh}

.rail{background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.rail-brand{height:var(--vital-h);display:flex;align-items:center;gap:var(--s-2);
  padding:0 var(--s-4);border-bottom:1px solid var(--line);flex-shrink:0}
.rail-mark{width:24px;height:24px;border-radius:var(--r-sm);background:var(--brand);
  color:var(--on-brand);display:grid;place-items:center;font-weight:var(--fw-black);font-size:var(--fs-13)}
.rail-name{font-weight:var(--fw-bold);font-size:var(--fs-13);letter-spacing:-.01em}
.rail-name small{display:block;color:var(--text-3);font-size:var(--fs-11);font-weight:var(--fw-med);letter-spacing:.04em}
.rail-nav{padding:var(--s-3) var(--s-2);display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1}
.rail-label{font-size:var(--fs-11);color:var(--text-3);letter-spacing:.08em;text-transform:uppercase;
  font-weight:var(--fw-semi);padding:var(--s-4) var(--s-3) var(--s-2)}
.navi{display:flex;align-items:center;gap:var(--s-3);padding:0 var(--s-3);height:34px;
  border-radius:var(--r-sm);background:none;border:0;cursor:pointer;color:var(--text-2);
  font-size:var(--fs-13);font-weight:var(--fw-med);text-align:left;width:100%;
  transition:background var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
.navi:hover{background:var(--surface-2);color:var(--text)}
.navi[aria-current="true"]{background:var(--brand-soft);color:var(--brand-ink);font-weight:var(--fw-semi)}
.navi-ico{width:16px;text-align:center;flex-shrink:0;opacity:.9}
.navi-n{margin-left:auto;font-size:var(--fs-11);font-variant-numeric:tabular-nums;
  color:var(--text-3);background:var(--surface-3);padding:1px 6px;border-radius:var(--r-pill)}
.navi[aria-current="true"] .navi-n{background:rgba(13,150,104,.2);color:var(--brand-ink)}
.navi-n.hot{background:var(--bad-soft);color:var(--bad-ink)}
.rail-foot{padding:var(--s-3);border-top:1px solid var(--line);display:flex;gap:var(--s-2);align-items:center}

/* ── VITAL BAR — hech qachon aylanmaydi ────────────────────────────────── */
.main{min-width:0;display:flex;flex-direction:column}
.vitals{height:var(--vital-h);border-bottom:1px solid var(--line);background:var(--surface);
  display:flex;align-items:stretch;position:sticky;top:0;z-index:40;overflow-x:auto;scrollbar-width:none}
.vitals::-webkit-scrollbar{display:none}
.vital{display:flex;flex-direction:column;justify-content:center;gap:1px;padding:0 var(--s-4);
  border-right:1px solid var(--line);flex-shrink:0;position:relative;min-width:104px}
.vital-k{font-size:var(--fs-11);color:var(--text-3);letter-spacing:.04em;white-space:nowrap}
.vital-v{font-size:var(--fs-14);font-weight:var(--fw-bold);font-variant-numeric:tabular-nums;
  display:flex;align-items:baseline;gap:5px;white-space:nowrap}
.vital-v small{font-size:var(--fs-11);font-weight:var(--fw-med);color:var(--text-3)}
.vital::after{content:"";position:absolute;left:0;top:0;bottom:0;width:2px}
.vital.is-ok::after{background:var(--ok)} .vital.is-warn::after{background:var(--warn)}
.vital.is-bad::after{background:var(--bad)} .vital.is-coin::after{background:var(--coin)}
.vital.is-ok .vital-v{color:var(--ok-ink)} .vital.is-warn .vital-v{color:var(--warn-ink)}
.vital.is-bad .vital-v{color:var(--bad-ink)} .vital.is-coin .vital-v{color:var(--coin-ink)}
.vital-spacer{flex:1;border:0;min-width:var(--s-2)}
.vital-act{display:flex;align-items:center;gap:var(--s-2);padding:0 var(--s-4);flex-shrink:0}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 0 0 rgba(34,197,94,.5);animation:pl 2.4s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(34,197,94,.45)}70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}

.canvas{padding:var(--s-5);display:flex;flex-direction:column;gap:var(--s-4);max-width:1680px;width:100%}

/* ── ASOSIY BO'LAKLAR ──────────────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.card-h{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-3) var(--s-4);
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-t{font-size:var(--fs-13);font-weight:var(--fw-bold);letter-spacing:-.005em}
.card-sub{font-size:var(--fs-11);color:var(--text-3)}
.card-b{padding:var(--s-4)}
.card-b.flush{padding:0}
.spacer{margin-left:auto}
.grid{display:grid;gap:var(--s-4)}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(176px,1fr))}
.row{display:flex;align-items:center;gap:var(--s-2);flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:var(--s-3)}
.dim{color:var(--text-2);font-size:var(--fs-12)}
.dim3{color:var(--text-3);font-size:var(--fs-11)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--ff-mono);font-size:var(--fs-12)}

/* ── TUGMA ─────────────────────────────────────────────────────────────── */
.btn{height:var(--ctrl-h);padding:0 var(--s-3);border-radius:var(--r-sm);cursor:pointer;
  background:var(--surface-2);border:1px solid var(--line-2);color:var(--text);
  font-size:var(--fs-12);font-weight:var(--fw-semi);display:inline-flex;align-items:center;
  gap:6px;white-space:nowrap;transition:background var(--dur-fast) var(--ease),transform var(--dur-fast) var(--ease)}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.pri:hover{background:var(--brand-hi)}
.btn.dgr{color:var(--bad-ink);border-color:rgba(239,68,68,.35)}
.btn.dgr:hover{background:var(--bad-soft)}
.btn.sm{height:26px;padding:0 var(--s-2);font-size:var(--fs-11)}
.btn.ghost{background:none;border-color:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.inp{height:var(--ctrl-h);padding:0 var(--s-3);border-radius:var(--r-sm);background:var(--surface-2);
  border:1px solid var(--line-2);color:var(--text);font-size:var(--fs-13);width:100%}
.inp::placeholder{color:var(--text-3)}
.srch{max-width:280px}

/* ── CHIP / BADGE ──────────────────────────────────────────────────────── */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:26px;padding:0 10px;border-radius:var(--r-pill);background:var(--surface-2);
  border:1px solid var(--line);color:var(--text-2);font-size:var(--fs-11);font-weight:var(--fw-semi);
  cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.chip:hover{border-color:var(--line-2);color:var(--text)}
.chip[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand-ink)}
.chip b{font-variant-numeric:tabular-nums;font-weight:var(--fw-bold)}
.chip.risk[aria-pressed="true"]{background:var(--bad-soft);border-color:rgba(239,68,68,.35);color:var(--bad-ink)}

.bdg{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:var(--r-sm);
  font-size:var(--fs-11);font-weight:var(--fw-semi);white-space:nowrap}
.bdg.ok{background:var(--ok-soft);color:var(--ok-ink)}
.bdg.warn{background:var(--warn-soft);color:var(--warn-ink)}
.bdg.bad{background:var(--bad-soft);color:var(--bad-ink)}
.bdg.info{background:var(--info-soft);color:var(--info-ink)}
.bdg.coin{background:var(--coin-soft);color:var(--coin-ink)}
.bdg.mute{background:var(--surface-3);color:var(--text-3)}

/* ── VAZIFA SATRI ──────────────────────────────────────────────────────── */
.task{display:flex;align-items:center;gap:var(--s-3);padding:11px var(--s-4);
  border-bottom:1px solid var(--line);position:relative}
.task:last-child{border-bottom:0}
.task::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.task.bad::before{background:var(--bad)} .task.warn::before{background:var(--warn)}
.task.ok::before{background:var(--ok)}
.task-x{flex:1;min-width:200px;font-size:var(--fs-13);line-height:1.55}
.task-x b{font-weight:var(--fw-bold)}
.task.bad .task-x b{color:var(--bad-ink)} .task.warn .task-x b{color:var(--warn-ink)}
.task.ok .task-x b{color:var(--ok-ink)}

/* ── STAT ──────────────────────────────────────────────────────────────── */
.stat{padding:var(--s-3) var(--s-4);border:1px solid var(--line);border-radius:var(--r);
  background:var(--surface);display:flex;flex-direction:column;gap:3px}
.stat-k{font-size:var(--fs-11);color:var(--text-3);letter-spacing:.03em}
.stat-v{font-size:var(--fs-26);font-weight:var(--fw-black);font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;line-height:1.1}
.stat-s{font-size:var(--fs-11);color:var(--text-2)}
.stat.coin .stat-v{color:var(--coin-ink)}
.stat.ok .stat-v{color:var(--ok-ink)} .stat.bad .stat-v{color:var(--bad-ink)}
.stat.warn .stat-v{color:var(--warn-ink)}

/* ── VORONKA ───────────────────────────────────────────────────────────── */
.fn{display:flex;flex-direction:column;gap:var(--s-2)}
.fn-r{display:grid;grid-template-columns:126px 1fr auto;align-items:center;gap:var(--s-3);
  cursor:pointer;padding:3px 0;border-radius:var(--r-sm)}
.fn-r:hover .fn-bar{filter:brightness(1.18)}
.fn-k{font-size:var(--fs-12);color:var(--text-2)}
.fn-track{height:22px;background:var(--surface-2);border-radius:var(--r-sm);overflow:hidden}
.fn-bar{height:100%;border-radius:var(--r-sm);transition:filter var(--dur) var(--ease)}
.fn-v{font-size:var(--fs-13);font-weight:var(--fw-bold);font-variant-numeric:tabular-nums;min-width:78px;text-align:right}
.fn-d{font-size:var(--fs-11);color:var(--text-3);font-variant-numeric:tabular-nums;
  padding-left:138px;margin-top:-4px}

/* ── JADVAL ────────────────────────────────────────────────────────────── */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:var(--fs-13)}
thead th{position:sticky;top:0;background:var(--surface-2);text-align:left;
  font-size:var(--fs-11);font-weight:var(--fw-semi);color:var(--text-3);letter-spacing:.04em;
  text-transform:uppercase;padding:0 var(--s-3);height:30px;white-space:nowrap;
  border-bottom:1px solid var(--line-2);z-index:5}
thead th.s{cursor:pointer;user-select:none}
thead th.s:hover{color:var(--text)}
thead th .ar{opacity:.4;margin-left:3px}
thead th[data-on] .ar{opacity:1;color:var(--brand-ink)}
tbody td{padding:0 var(--s-3);height:var(--row-h);border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr{cursor:pointer;transition:background var(--dur-fast) var(--ease)}
tbody tr:hover{background:var(--surface-2)}
tbody tr.sel{background:var(--brand-soft)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.t-main{font-weight:var(--fw-semi)}
.t-sub{color:var(--text-3);font-size:var(--fs-11)}
.t-coin{color:var(--coin-ink);font-weight:var(--fw-bold)}

.mini{width:52px;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;display:inline-block;vertical-align:middle}
.mini i{display:block;height:100%;border-radius:3px}

.thumb{width:28px;height:28px;border-radius:var(--r-sm);background:var(--coin-soft);
  display:grid;place-items:center;font-size:15px;flex-shrink:0}

/* ── DRAWER ────────────────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:var(--overlay);opacity:0;pointer-events:none;
  transition:opacity var(--dur) var(--ease);z-index:70}
.scrim.on{opacity:1;pointer-events:auto}
.drw{position:fixed;top:0;right:0;bottom:0;width:min(464px,100vw);background:var(--surface);
  border-left:1px solid var(--line);z-index:80;transform:translateX(100%);
  transition:transform var(--dur) var(--ease);display:flex;flex-direction:column;box-shadow:var(--sh-3)}
.drw.on{transform:none}
.drw-h{padding:var(--s-4);border-bottom:1px solid var(--line);display:flex;
  align-items:flex-start;gap:var(--s-3);flex-shrink:0}
.drw-b{overflow-y:auto;padding:var(--s-4);display:flex;flex-direction:column;gap:var(--s-4);flex:1}
.drw-f{padding:var(--s-3) var(--s-4);border-top:1px solid var(--line);display:flex;
  gap:var(--s-2);flex-wrap:wrap;flex-shrink:0;background:var(--surface-2)}
.ava{width:38px;height:38px;border-radius:var(--r);background:var(--brand-soft);color:var(--brand-ink);
  display:grid;place-items:center;font-weight:var(--fw-bold);font-size:var(--fs-14);flex-shrink:0}
.sec-t{font-size:var(--fs-11);color:var(--text-3);letter-spacing:.08em;text-transform:uppercase;
  font-weight:var(--fw-semi);margin-bottom:var(--s-2)}

.bk{display:flex;flex-direction:column;gap:7px}
.bk-r{display:grid;grid-template-columns:100px 1fr 62px;align-items:center;gap:var(--s-2);font-size:var(--fs-12)}
.bk-t{height:7px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.bk-t i{display:block;height:100%;border-radius:4px}
.bk-v{text-align:right;font-variant-numeric:tabular-nums;font-weight:var(--fw-semi)}

.tl{display:flex;flex-direction:column;gap:0;position:relative;padding-left:var(--s-4)}
.tl::before{content:"";position:absolute;left:4px;top:8px;bottom:8px;width:1px;background:var(--line-2)}
.tl-r{display:flex;gap:var(--s-3);padding:7px 0;font-size:var(--fs-12);position:relative}
.tl-r::before{content:"";position:absolute;left:calc(-1 * var(--s-4) + 1px);top:13px;
  width:7px;height:7px;border-radius:50%;background:var(--text-3);border:2px solid var(--surface)}
.tl-r.coin::before{background:var(--coin)} .tl-r.bad::before{background:var(--bad)}
.tl-r.ok::before{background:var(--ok)}
.tl-w{width:74px;color:var(--text-3);font-size:var(--fs-11);flex-shrink:0;font-variant-numeric:tabular-nums}
.tl-x{flex:1}
.tl-v{font-variant-numeric:tabular-nums;font-weight:var(--fw-semi)}

/* ── YUKLASH ZONASI ────────────────────────────────────────────────────── */
.drop{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:var(--s-5);
  text-align:center;color:var(--text-2);font-size:var(--fs-12);cursor:pointer;
  transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease)}
.drop:hover,.drop.hot{border-color:var(--brand-line);background:var(--brand-soft);color:var(--brand-ink)}
.drop b{display:block;font-size:var(--fs-13);color:var(--text);margin-bottom:3px}
.drop.hot b{color:var(--brand-ink)}

/* ── MODAL ─────────────────────────────────────────────────────────────── */
.mdl{position:fixed;inset:0;z-index:100;display:none;align-items:flex-start;justify-content:center;
  padding:var(--s-8) var(--s-4);overflow-y:auto}
.mdl.on{display:flex}
.mdl-c{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);
  width:min(860px,100%);box-shadow:var(--sh-3);position:relative;z-index:2;
  animation:up var(--dur-slow,240ms) var(--ease)}
@keyframes up{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.step{display:flex;gap:var(--s-2);padding:var(--s-3) var(--s-4);border-bottom:1px solid var(--line);
  align-items:center;flex-wrap:wrap}
.step-i{display:flex;align-items:center;gap:6px;font-size:var(--fs-12);color:var(--text-3)}
.step-i b{width:18px;height:18px;border-radius:50%;background:var(--surface-3);display:grid;
  place-items:center;font-size:var(--fs-11);font-weight:var(--fw-bold)}
.step-i.on{color:var(--text)} .step-i.on b{background:var(--brand);color:var(--on-brand)}
.step-i.done b{background:var(--ok-soft);color:var(--ok-ink)}
.step-d{width:14px;height:1px;background:var(--line-2)}
textarea.inp{height:auto;padding:var(--s-3);font-family:var(--ff-mono);font-size:var(--fs-12);
  line-height:1.7;resize:vertical}

.dif-add{color:var(--ok-ink)} .dif-chg{color:var(--warn-ink)} .dif-err{color:var(--bad-ink)}
.old{color:var(--text-3);text-decoration:line-through}

/* ── PALITRA (⌘K) ──────────────────────────────────────────────────────── */

   ══════════════════════════════════════════════════════════════════════════ */
function area(vals,color,h=54){
  const w=100, max=Math.max(...vals), min=0;
  const pt=(v,i)=>[ (i/(vals.length-1))*w, h-4-((v-min)/(max-min))*(h-10) ];
  const p=vals.map(pt);
  const line=p.map((c,i)=>(i?"L":"M")+c[0].toFixed(2)+" "+c[1].toFixed(2)).join(" ");
  const last=p[p.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px;display:block">
    <defs><linearGradient id="g${color.replace(/\W/g,"")}" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".28"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${line} L ${w} ${h} L 0 ${h} Z" fill="url(#g${color.replace(/\W/g,"")})"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="2.2" fill="${color}"/></svg>`;
}

let SIM={ride:35,refer:150,price:1.0};
function simCalc(){
  const em = Math.round(486000*(SIM.ride/35)*.55 + 486000*(SIM.refer/150)*.2 + 380000);
  const cards = Math.round(em/(1200*SIM.price));
  const cost = Math.round(cards*1200*SIM.price*1*.29);
  const cover = (cards*1200*SIM.price)/Math.max(1,cost);
  return {em,cards,cost,cover};
}

function closeAll(){ const d=document.getElementById("drw");

function toast(t,tone){ const h=document.getElementById("toasts");
  const n=el(`<div class="toast ${tone||""}">${t}</div>`); h.appendChild(n);
  setTimeout(()=>{n.style.opacity="0";n.style.transition="opacity .3s";setTimeout(()=>n.remove(),320)},3400); }
function toggleTheme(){ const r=document.documentElement;
  const dark=r.getAttribute("data-theme")!=="light";

function openPal(){ document.getElementById("pal").classList.add("on");
  const i=document.getElementById("palI"); i.value=""; palList(""); setTimeout(()=>i.focus(),30); }
function closePal(){ document.getElementById("pal").classList.remove("on"); }
function palList(q){
  const r=CMDS.filter(c=>c[0].toLowerCase().includes(q.toLowerCase()));
  document.getElementById("palL").innerHTML = r.length?r.map((c,i)=>
    `<div class="pal-r ${i===0?"on":""}" onclick="closePal();(${CMDS.indexOf(c)},CMDS[${CMDS.indexOf(c)}][2])()">
      ${c[0]}<span class="pal-g">${c[1]}</span></div>`).join("")
    : `<div class="pal-r" style="color:var(--text-3)">«${q}» bo'yicha buyruq topilmadi</div>`;
}
document.getElementById("palI").addEventListener("input",e=>palList(e.target.value));
document.addEventListener("keydown",e=>{
  if((e.key==="k"||e.key==="K")&&(e.metaKey||e.ctrlKey)){e.preventDefault();openPal();}
  else if(e.key==="Escape"){closePal();closeMdl();closeAll();}
  else if(e.key==="Enter"&&document.getElementById("pal").classList.contains("on")){
    const f=document.querySelector(".pal-r.on"); if(f) f.click(); }
});
