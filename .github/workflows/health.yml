name: Health monitor

# 2026-07-21 incident: the bot crash-looped for ~14 hours and nobody knew. This cron
# pings /health every ~10 minutes (GitHub cron is best-effort, real cadence 10-20 min);
# after 3 straight in-run failures it alerts the admin chat via Telegram — admins only,
# NEVER customers. Side benefit: regular pings keep the Render free instance awake.
# Retire/repoint URL after the Contabo migration.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check /health (3 tries), alert Telegram on total failure
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
          HEALTH_URL: https://kas1067-taxi-fra.onrender.com/health
        run: |
          set -uo pipefail
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/health_body -w "%{http_code}" --max-time 60 "$HEALTH_URL" || echo 000)
            echo "try $i: HTTP $code"
            if [ "$code" = "200" ]; then
              cat /tmp/health_body; exit 0
            fi
            sleep 30
          done
          text="🚨 1067 bot HEALTH FAIL: $HEALTH_URL 3 urinishda ham javob bermadi (oxirgi HTTP $code). Render logs: dashboard.render.com"
          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            -d chat_id="$ALERT_CHAT_ID" --data-urlencode text="$text" >/dev/null
          exit 1
