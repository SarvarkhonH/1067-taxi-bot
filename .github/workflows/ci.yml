name: CI shield

# T8 shield — the merge gate. Three checks that need NO secrets and NO live DB, so
# they run safely on every push/PR and block on regression:
#   1. typecheck every package (catches type/contract breaks)
#   2. vitest money-math unit suite (pure clamp/knob/booking helpers in @t1067/shared)
#   3. the Monte-Carlo economy sim (proves the ≤350/ride BUZILMAS rule still holds)
# The DB-integration E2E (testE2E.ts) hits live Neon + writes TAG'd rows, so it is
# run locally / pre-release (see packages/server/src/scripts/testE2E.ts), NOT here.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shield:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate (types for the server typecheck)
        run: pnpm --filter @t1067/server exec prisma generate

      - name: Typecheck (all packages)
        run: pnpm -r typecheck

      - name: Money-math unit tests — vitest (pure functions, no DB)
        run: pnpm --filter @t1067/shared test

      - name: Economy invariant — Monte-Carlo sim (≤350/ride, no DB)
        run: pnpm --filter @t1067/server exec tsx src/scripts/simEconomy.ts

      # 🎁 Sodiqlik dasturi iqtisodi. `simEconomy.ts` da `oyin` so'zi UMUMAN yo'q — ya'ni u
      # yashil bo'lishi ball/mukofot o'zgarishi haqida HECH NARSA demasdi (nazoratchi agent
      # 2026-08-04 topdi). Bu sinov m=3 kafolatini, NaN/Infinity qo'riqlarini va bepul yo'l
      # chegarasini tekshiradi. DB kerak emas.
      - name: Loyalty invariant — m=3 kafolati + chekka qiymatlar (no DB)
        run: pnpm --filter @t1067/server exec tsx src/scripts/simLoyalty.ts

      # 🛡 Nazoratchi qo'riqlari. `simFullGame.ts` ball formulasining QAYTA YOZILGAN nusxasini
      # sinardi — shuning uchun 2026-08-04 dagi 18 ta topilmaning BIRORTASINI ushlamadi.
      # Bu sinov faqat MODULDAN IMPORT QILINGAN qiymatlarni tekshiradi (nusxa yo'q):
      # arxiv ro'yxati ball manbaini kuydirmasligi · narx→daraja moslashuvi · jamoa balli
      # navbat saqlanmagunga qadar 0 ekani. Kod o'zgarsa sinov ham o'zgaradi.
      - name: Qo'riqlar — arxiv/daraja/jamoa, haqiqiy kodga qarshi (no DB)
        run: pnpm --filter @t1067/server exec tsx src/scripts/simGuards.ts

  # CI-gated deploy (2026-07-21 incident): a red shield must block the release —
  # previously a push with a missing file deployed anyway and the bot crash-looped.
  # 2026-07-25: target moved from Render to the Contabo VPS. deploy.sh pulls, builds
  # the frontends, restarts bot1067 and health-checks; it exits non-zero on failure,
  # so a bad release fails THIS job — visible in GitHub, not silent on the server.
  deploy:
    needs: shield
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -t ed25519 "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "root@$VPS_HOST" \
            'bash /opt/app/deploy/deploy.sh'
