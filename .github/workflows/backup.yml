name: Nightly DB backup

# HARDENING-P0.1: nightly logical dump of the live Neon DB (backup.ts — schema-parity
# guarded, all models or it refuses). Snapshot is stored as a GitHub Actions artifact
# (30-day retention) — an off-site copy that survives the laptop AND the DB host.
# 22:30 UTC = 03:30 Toshkent. On failure it alerts the admin chat — a backup that
# silently stops running is how the June→July gap happened.

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @t1067/server exec prisma generate

      - name: Dump all tables
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @t1067/server exec tsx src/scripts/backup.ts

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-snapshot-${{ github.run_id }}
          path: backups/*.json
          retention-days: 30
          if-no-files-found: error

      - name: Alert admin on failure
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            -d chat_id="$ALERT_CHAT_ID" \
            --data-urlencode text="🚨 1067 tungi DB-backup YIQILDI — github.com/${{ github.repository }}/actions run ${{ github.run_id }}" >/dev/null
